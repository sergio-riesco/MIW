#cloud-config
package_update: true
ssh_pwauth: true

users:
  - name: '${vm_username}'
    plain_text_passwd: '${vm_password}'
    groups:
      - sudo
    lock_passwd: false
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

packages:
    - docker.io
    - python3-flask

write_files:
   - path: '/home/${vm_username}/app.py'
     permissions: '0644'
     owner: root:root
     content: |
       from flask import Flask
       app = Flask(__name__)
       @app.route('/')
       def hello():
           return '<h1>Hola Mundo - VM1 de ${vm_username}</h1>'
       if __name__ == '__main__':
           app.run(host='0.0.0.0', port=80)

runcmd:
    - chown ${vm_username}:${vm_username} /home/${vm_username}/app.py
    - nohup python3 /home/${vm_username}/app.py > /home/${vm_username}/app.log 2>&1 &