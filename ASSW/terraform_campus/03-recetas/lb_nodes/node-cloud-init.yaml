#cloud-config
package_update: true
ssh_pwauth: true

users:
  - name: '${vm_username}'
    plain_text_passwd: '${vm_password}'
    lock_passwd: false
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

packages:
  - apache2

runcmd:
  - echo "<h1>Web nodo ${node_index}</h1>" > /var/www/html/index.html
  - systemctl restart apache2
