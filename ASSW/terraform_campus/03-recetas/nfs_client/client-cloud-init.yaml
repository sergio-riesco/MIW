#cloud-config
package_update: true
ssh_pwauth: true

users:
  - name: '${vm_username}'
    plain_text_passwd: '${vm_password}'
    lock_passwd: false
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

packages:
  - nfs-common

runcmd:
  - mkdir -p ${mount_point}
  - mount -t nfs -o nfsvers=4 ${nfs_server_ip}:${export_path} ${mount_point}
  - echo "${nfs_server_ip}:${export_path} ${mount_point} nfs nfsvers=4,defaults,_netdev 0 0" >> /etc/fstab
