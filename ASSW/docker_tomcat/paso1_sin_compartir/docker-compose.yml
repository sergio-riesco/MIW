services:
  tomcat1:
    image: tomcat1-app
    build:
      context: .
      dockerfile: Dockerfile.app1
    container_name: tomcat1
    networks:
      mynet:
        ipv4_address: 172.20.0.10
    ports:
      - "8081:8080"

  tomcat2:
    image: tomcat2-app
    build:
      context: .
      dockerfile: Dockerfile.app2
    container_name: tomcat2
    networks:
      mynet:
        ipv4_address: 172.20.0.11
    ports:
      - "8082:8080"

networks:
  mynet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
